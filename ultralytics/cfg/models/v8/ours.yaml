nc: 1
scales:

  s: [0.33, 0.50, 1024]
#  m: [0.67, 0.75, 768]
#  l: [1.00, 1.00, 512]
#  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 6, 2, 2]] # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, CSP, [128, True]]
  - [-1, 1, AFM, [128]] # 3-P3/8

  - [-2, 1, Conv, [256, 3, 2]] # 5-P4/16
  - [-1, 3, FSFG, [256, True]]
  - [-1, 1, AFM, [256]] # 6-P4/8

  - [-2, 1, Conv, [512, 3, 2]] # 7-P5/32
  - [-1, 6, FSFG, [512, True]]
  - [-1, 1, SPPF, [512, 5]] # 9

head:
  - [-1, 1, Conv, [256, 1, 1]] # 10
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, FFM_Concat2, [1]] # cat backbone P4
  - [-1, 3, CSP, [256]] # 13


  - [-1, 1, Conv, [128, 1, 1]] # 14
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 3], 1, Concat2, [1]] # cat backbone P3
  - [-1, 3, CSP, [128]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6, 14], 1, Concat3, [1]] # cat head P4
  - [-1, 3, CSP, [256]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat2, [1]] # cat head P5
  - [-1, 3, CSP, [512]] # 23 (P5/32-large)


  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
